[project]
name = "kolega-extension-example"
version = "0.1.0"
description = "Minimal Kolega Code CLI extension: one prompt section, one harmless tool."
requires-python = ">=3.11"
dependencies = ["kolega-code"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kolega_extension_example"]
