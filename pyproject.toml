[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kolega-code"
version = "0.28.0"
description = "Multi-agent coding in the terminal"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Kolega Team"}
]
keywords = ["ai", "agent", "cli", "coding-agent", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "anthropic==0.101.0",
    # ATIF v1.7 trajectory models: every `sessions export --format atif` /
    # `ask --atif-output` document is validated before it is written.
    "atif==1.7.0",
    "beautifulsoup4==4.14.3",
    # Not imported directly (google-auth/pdfminer-six pull it in); pinned for
    # security: 48.0.1 is vulnerable to CVE-2026-69247/-69248/-69249 (PKCS#7
    # Bleichenbacher oracle, a name-constraint wildcard bypass, and a
    # path-building DoS), all fixed only by 50.0.0 — which, like every release
    # since 49, ships no Intel-mac wheels. Intel Macs would fall back to the
    # sdist (Rust + OpenSSL headers) and break the curl-install, so they hold
    # the last universal2 build and ACCEPT those three advisories on that
    # legacy platform; the audit ignores exactly these IDs (see the
    # "Audit locked dependencies" step in .github/workflows/ci.yml). Every
    # other platform takes the fixed release.
    "cryptography==50.0.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "cryptography==48.0.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "ddgs==9.14.4",
    # The session server ships to every user, so its stack is a core dependency.
    # starlette/uvicorn/websockets were already installed transitively (mcp pulls
    # the first two, firecrawl-py and google-genai pull websockets); they are
    # pinned directly because the server must not depend on an unrelated package
    # continuing to require them.
    "fastapi==0.139.2",
    "firecrawl-py==4.28.2",
    # Project memory needs a persistent Unix lock file; unlink-on-release can split cooperating waiters.
    "filelock==3.20.3",
    "google-genai==2.12.1",
    "httpx==0.28.1",
    # Protocol-v1 URLs follow WHATWG-compatible non-transitional UTS-46 host normalization.
    "idna==3.18",
    "jinja2==3.1.6",
    "langfuse==3.14.5",
    "lxml-html-clean==0.4.5",
    "markdownify==1.2.3",
    "markitdown[docx,pdf,pptx,xls,xlsx]==0.1.6",
    "mcp==1.28.1",
    "nest-asyncio==1.6.0",
    # Magika's cross-platform resolution selects onnxruntime 1.20.1, which has no CPython 3.14 wheels.
    "onnxruntime==1.27.0; python_version >= '3.14' and sys_platform != 'win32'",
    "openai==2.46.0",
    "packaging==25.0",
    "pathspec==1.1.1",
    "pillow==12.3.0",
    "playwright==1.59.0",
    "psutil==7.2.2",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    # Load-bearing for the web UI: code highlighting is generated with the same
    # Pygments styles the TUI renders with, so both stay identical.
    "pygments==2.20.0",
    "pyyaml==6.0.3",
    "readability-lxml==0.8.4.1",
    "tavily-python==0.7.26",
    "tenacity==9.1.4",
    "textual==8.2.5",
    "tiktoken==0.12.0",
    "trafilatura==2.0.0",
    "uvicorn==0.49.0",
    "websockets==16.0",
]

[project.urls]
Homepage = "https://kolega-ai.github.io/kolega-code/"
Documentation = "https://kolega-ai.github.io/kolega-code/"
Repository = "https://github.com/kolega-ai/kolega-code"
Issues = "https://github.com/kolega-ai/kolega-code/issues"
Changelog = "https://github.com/kolega-ai/kolega-code/blob/main/CHANGELOG.md"
Contributing = "https://github.com/kolega-ai/kolega-code/blob/main/CONTRIBUTING.md"
Releases = "https://github.com/kolega-ai/kolega-code/releases"
Security = "https://github.com/kolega-ai/kolega-code/security/policy"

[project.optional-dependencies]
cli = []
# Native Tinker sampling (the ``tinker`` provider). Heavy on purpose: the
# official renderer stack needs torch (tinker-cookbook hard-requires torch>=2.0,
# tml-renderers >=2.10) and transformers; the base install stays torch-free.
# tml-renderers ships abi3 wheels for Linux x86_64/aarch64 and macOS arm64 only.
tinker = [
    "tinker-cookbook==0.5.3",
    "tml-renderers==0.1.0",
]
dev = [
    "genbadge[coverage]==1.1.3",
    "pre-commit==4.6.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "pytest-xdist==3.8.0",
    "pyright==1.1.411",
    "ruff==0.15.12",
    "twine==6.2.0",
]

[project.scripts]
kolega-code = "kolega_code.cli.main:main"
kolega-code-browser-host = "kolega_code.browser_extension.native_host:main"

[tool.hatch.build.targets.wheel]
packages = ["kolega_code"]

[tool.hatch.build.targets.sdist]
exclude = ["/.kolega/worktrees/**"]
include = [
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/MIGRATION.md",
    "/README.md",
    "/RELEASING.md",
    "/kolega_code/**",
    "/pyproject.toml",
]
skip-excluded-dirs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow running tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["examples/parallel-code-review.py", "kolega_code/_bundled_skills"]

[tool.uv]
exclude-newer = "1 week"
# cryptography 50.0.0 (released 2026-07-31) is the only release fixing
# CVE-2026-69247/-69248/-69249 and sat inside the 1-week quarantine when the
# advisories landed (2026-08-04); admit it without widening the global window.
# h2 4.4.1 (released 2026-08-03) is the only release fixing GHSA-6hr6-w5qg-qmwg
# (CVE-2026-71554, duplicate Host header request smuggling) and sits inside the
# same quarantine; admit it the same way.
exclude-newer-package = { cryptography = "2026-08-01T00:00:00Z", h2 = "2026-08-04T00:00:00Z" }

[tool.pyright]
include = ["kolega_code", "benchmarks", "tests"]
exclude = [
    "benchmarks/edit_tools/fixtures/snapshots",
    # Terminal-Bench (Harbor) adapter: imports the optional `harbor` package,
    # which isn't a project dependency, so pyright can't resolve it.
    "benchmarks/terminal_bench",
    "kolega_code/_bundled_skills",
]
typeCheckingMode = "basic"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "tree-sitter-language-pack==1.6.0",
]
