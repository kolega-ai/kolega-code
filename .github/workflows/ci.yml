name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      coverage-badge-only: ${{ steps.detect.outputs.coverage-badge-only }}
    steps:
      - name: Detect coverage-badge-only change
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          elif [ "${{ github.event_name }}" = "push" ]; then
            files=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" --jq '.files[].filename')
          else
            echo "coverage-badge-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$files"

          file_count=$(printf '%s\n' "$files" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$file_count" = "1" ] && [ "$files" = "docs/src/assets/coverage.svg" ]; then
            echo "coverage-badge-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "coverage-badge-only=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Python ${{ matrix.python-version }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Skip coverage-badge-only change
        if: needs.changes.outputs.coverage-badge-only == 'true'
        run: echo "Skipping Python checks for coverage badge-only change."

      - name: Checkout
        if: needs.changes.outputs.coverage-badge-only != 'true'
        uses: actions/checkout@v5

      - name: Setup Python
        if: needs.changes.outputs.coverage-badge-only != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        if: needs.changes.outputs.coverage-badge-only != 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        if: needs.changes.outputs.coverage-badge-only != 'true'
        run: uv sync --extra dev --frozen

      - name: Get Playwright version
        if: needs.changes.outputs.coverage-badge-only != 'true'
        id: playwright-version
        run: echo "version=$(uv run python -c "from importlib.metadata import version; print(version('playwright'))")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        if: needs.changes.outputs.coverage-badge-only != 'true'
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # The system-deps half of this install (apt fetching font packages) has
      # stalled for up to 10 minutes on flaky mirrors, so it only runs when the
      # browser cache misses (i.e. on a Playwright version bump). On cache hits
      # the runner image's preinstalled browser libraries cover Chromium.
      - name: Install Playwright Chromium
        if: needs.changes.outputs.coverage-badge-only != 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium

      - name: Run pre-commit hooks
        if: needs.changes.outputs.coverage-badge-only != 'true'
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # Coverage runs on 3.11 only: it is the version whose coverage.xml the
      # badge job consumes, and instrumenting the other matrix jobs costs
      # minutes of wall time for artifacts nothing reads.
      - name: Run fast tests
        if: needs.changes.outputs.coverage-badge-only != 'true'
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            ./run_tests.sh --coverage
          else
            ./run_tests.sh
          fi

      - name: Build and verify bundled skill package data
        if: needs.changes.outputs.coverage-badge-only != 'true' && matrix.python-version == '3.11'
        run: |
          uv build --out-dir /tmp/kolega-code-dist
          uv run python scripts/verify_bundled_skill_artifacts.py /tmp/kolega-code-dist/*

      - name: Upload coverage report
        if: needs.changes.outputs.coverage-badge-only != 'true' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  coverage-badge:
    name: Update coverage badge
    needs: [changes, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.coverage-badge-only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Download Python 3.11 coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-xml-python-3.11
          path: coverage-artifact

      - name: Generate coverage badge
        run: |
          uv run genbadge coverage -i coverage-artifact/coverage.xml -o docs/src/assets/coverage.svg
          python - <<'PY'
          from pathlib import Path

          badge = Path("docs/src/assets/coverage.svg")
          badge.write_text(badge.read_text().rstrip("\n") + "\n")
          PY

      - name: Verify coverage badge PR token
        env:
          COVERAGE_BADGE_PR_TOKEN: ${{ secrets.COVERAGE_BADGE_PR_TOKEN }}
        run: |
          if [ -z "$COVERAGE_BADGE_PR_TOKEN" ]; then
            echo "::error::Set the COVERAGE_BADGE_PR_TOKEN repository secret to a trusted bot/user token."
            exit 1
          fi

      - name: Create coverage badge pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.COVERAGE_BADGE_PR_TOKEN }}
          add-paths: docs/src/assets/coverage.svg
          commit-message: "chore: update coverage badge"
          committer: "${{ vars.COVERAGE_BADGE_COMMITTER || 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' }}"
          author: "${{ vars.COVERAGE_BADGE_AUTHOR || 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' }}"
          branch: chore/update-coverage-badge
          delete-branch: true
          title: "chore: update coverage badge"
          body: |
            Automated coverage badge update from CI after tests passed on `main`.

      - name: Enable auto-merge for coverage badge PR
        if: steps.cpr.outputs.pull-request-number != '' && steps.cpr.outputs.pull-request-operation != 'none'
        env:
          GH_TOKEN: ${{ secrets.COVERAGE_BADGE_PR_TOKEN }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --auto --squash --delete-branch

  dependency-audit:
    name: Dependency audit
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip coverage-badge-only change
        if: needs.changes.outputs.coverage-badge-only == 'true'
        run: echo "Skipping dependency audit for coverage badge-only change."

      - name: Checkout
        if: needs.changes.outputs.coverage-badge-only != 'true'
        uses: actions/checkout@v5

      - name: Setup Python
        if: needs.changes.outputs.coverage-badge-only != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        if: needs.changes.outputs.coverage-badge-only != 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify and audit eval bundle
        if: needs.changes.outputs.coverage-badge-only != 'true'
        run: |
          cp kolega_code/agent/eval/bundle-requirements.txt /tmp/eval-bundle-requirements.txt
          uv pip compile \
            --universal \
            --python-version 3.12 \
            --custom-compile-command \
              'uv pip compile --universal --python-version 3.12 bundle-requirements.in -o bundle-requirements.txt' \
            kolega_code/agent/eval/bundle-requirements.in \
            -o /tmp/eval-bundle-requirements.txt \
            --quiet
          diff -u kolega_code/agent/eval/bundle-requirements.txt /tmp/eval-bundle-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit \
            -r kolega_code/agent/eval/bundle-requirements.txt \
            --no-deps \
            --disable-pip \
            --progress-spinner off

      - name: Audit locked dependencies
        if: needs.changes.outputs.coverage-badge-only != 'true'
        run: |
          set +e
          # Accepted advisories: cryptography 48.0.1 on the Intel-mac fork only
          # (every other platform locks the fixed 50.0.0). All three are fixed
          # only by releases that dropped Intel-mac wheels, so upgrading would
          # break the curl-install there with a Rust+OpenSSL source build; the
          # legacy platform accepts the risk instead. Revisit if cryptography
          # ever restores Intel-mac wheels, or when Intel-mac support ends.
          # Each advisory is listed in all three id forms (PYSEC/GHSA/CVE):
          # --ignore matches only the primary id, and which form the OSV
          # service reports as primary has been observed to vary.
          #
          # Also accepted: transformers CVE-2026-9856. The vulnerable releases
          # are the only ones the tinker stack permits (tinker-cookbook caps
          # transformers at 5.5.4), and the fix (5.10.0) lies outside that cap,
          # so a lock-level pin is unsatisfiable. Revisit when tinker raises
          # its transformers upper bound.
          uv audit --locked --output-format json \
            --ignore PYSEC-2026-3552 --ignore GHSA-g6cj-pr64-35w5 --ignore CVE-2026-69247 \
            --ignore PYSEC-2026-3553 --ignore GHSA-jwv3-5hgf-82ww --ignore CVE-2026-69249 \
            --ignore PYSEC-2026-3554 --ignore GHSA-m2h6-j472-rp4c --ignore CVE-2026-69248 \
            --ignore GHSA-xrqw-3rrv-vx5w --ignore CVE-2026-9856 \
            > /tmp/uv-audit.json
          audit_status=$?
          set -e

          cat /tmp/uv-audit.json

          # Exit codes above 1 indicate that the audit itself failed, rather than
          # that it found reportable dependency issues.
          if [ "$audit_status" -gt 1 ]; then
            exit "$audit_status"
          fi

          # socksio is an archived but vulnerability-free transitive dependency
          # required by ddgs through HTTPX's SOCKS proxy support. uv currently
          # has no adverse-status allowlist, so filter only this known status and
          # continue to fail on every vulnerability or other adverse status.
          jq -e '
            (.vulnerabilities | length == 0) and
            ([.adverse_statuses[] |
              select(.name != "socksio" or .status != "archived")
            ] | length == 0)
          ' /tmp/uv-audit.json
